name: CI
on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]

jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci || npm i
      - run: npm run lint --if-present
      - run: npm run build --if-present

