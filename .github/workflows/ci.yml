name: CI
on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - '.github/workflows/**'
  push:
    branches: [ dev ]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - '.github/workflows/**'


jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # DETEKSI: jalan di root repo (tanpa working-directory)
      - id: detect-frontend
        name: Detect frontend project
        run: |
          if [ -f "apps/frontend/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect-frontend.outputs.present == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install (frontend)
        if: steps.detect-frontend.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm ci || npm i

      - name: Lint (frontend)
        if: steps.detect-frontend.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm run lint --if-present

      - name: Test (frontend)
        if: steps.detect-frontend.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm test --if-present -- --ci

      - name: Build (frontend)
        if: steps.detect-frontend.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm run build --if-present

      - uses: actions/upload-artifact@v4
        if: steps.detect-frontend.outputs.present == 'true' && success()
        with:
          name: frontend-dist
          path: apps/frontend/dist/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
       # DETEKSI: jalan di root repo (tanpa working-directory)
      - id: detect-backend
        name: Detect backend project
        run: |
          if [ -f "apps/backend/pom.xml" ] || [ -f "apps/backend/build.gradle" ] || [ -f "apps/backend/settings.gradle" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.detect-backend.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven 

      - name: Test (backend)
        if: steps.detect-backend.outputs.present == 'true'
        working-directory: apps/backend
        run: ./gradlew --no-daemon test || mvn -B -ntp test

      - name: Build (backend)
        if: steps.detect-backend.outputs.present == 'true'
        working-directory: apps/backend
        run: ./gradlew --no-daemon build -x test || mvn -B -ntp verify

      - uses: actions/upload-artifact@v4
        if: steps.detect-backend.outputs.present == 'true' && success()
        with:
          name: backend-artifacts
          path: |
            apps/backend/build/libs/*.jar
            apps/backend/target/*.jar
